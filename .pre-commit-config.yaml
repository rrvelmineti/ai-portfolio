# Install with: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Synthetic claims extracts are byte-exact (hashes in their manifest): never rewrite.
      - id: trailing-whitespace
        exclude: ^products/claims-onboarding/data/synthetic/
      - id: end-of-file-fixer
        exclude: ^products/claims-onboarding/data/synthetic/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff and mypy run from the project's locked environment so versions
  # always match CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
