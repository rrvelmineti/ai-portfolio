# Local development services. Credentials come from .env (see .env.example);
# nothing secret is written here.
#
#   docker compose up -d db
#   then set DATABASE_URL / TEST_DATABASE_URL in .env (see .env.example)
services:
  db:
    # Postgres 16 with pgvector preinstalled (needed by later phases, e.g. Query Desk).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - "127.0.0.1:5432:5432"   # local machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
