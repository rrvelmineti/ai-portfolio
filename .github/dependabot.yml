# Weekly, grouped dependency updates (one PR per ecosystem). Every PR runs the full CI,
# including the image build and Trivy scan.
version: 2
updates:
  # Base images in the Dockerfile, pinned by digest: Dependabot proposes new digests
  # (Debian security rebuilds) and patch releases. Python stays on 3.12 until we decide
  # otherwise, so minor and major tag changes are ignored.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build(docker)

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Python dependencies (uv.lock across the whole workspace).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
