name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml. Throwaway, CI-only credentials.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests create a fresh database from this admin connection and run the
      # Alembic migrations into it. REQUIRE_DB_TESTS turns "skip" into "fail".
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-not-a-secret@localhost:5432/ci
      REQUIRE_DB_TESTS: "1"
      # Local injection classifier (ADR 0007): pinned files, cached below, verified on load.
      GUARD_MODEL_DIR: ${{ github.workspace }}/.models
      REQUIRE_GUARD_MODEL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # Cache key = the pinned Hub revision in injection/ml.py, so a new pin downloads once.
      # The cache holds the model with its Apache-2.0 LICENSE and the mmBERT MIT NOTICE.
      - name: Guard model cache key
        id: guard-model
        run: |
          rev=$(grep -oP 'revision="\K[0-9a-f]{40}' core/guardrails/src/ai_platform_guardrails/injection/ml.py)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Cache guard model
        uses: actions/cache@v4
        with:
          path: .models
          key: guard-model-${{ steps.guard-model.outputs.rev }}

      - name: Download and verify guard model
        run: uv run python scripts/download_guard_model.py

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest

      # Report only (ADR 0006/0007): prints development vs held-out v1 and v2 numbers, never
      # fails the build. The development targets are enforced by the pytest gate above.
      - name: Guardrails held-out report
        run: |
          uv run python scripts/guardrails_report.py --heldout --heldout-v2 \
            --out "$RUNNER_TEMP/guardrails-results.md" 2>/dev/null \
            | sed -n '/## Held-out and public evaluation/,$p' || true

  # Builds the demo image on every PR and on main, and scans it (ADR 0008). Never pushes
  # and never deploys: deployment is deploy.yml, after CI passes on main.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: ai-portfolio-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test (non-root, health endpoint, no secrets baked in)
        run: |
          test "$(docker run --rm --entrypoint id ai-portfolio-demo:ci -u)" = "10001"
          docker run -d --name demo -p 127.0.0.1:8080:8080 \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e DATABASE_URL=postgresql+psycopg://nobody:none@127.0.0.1:1/none \
            ai-portfolio-demo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/robots.txt | grep -q "Disallow: /"
          docker rm -f demo
          ! docker run --rm --entrypoint sh ai-portfolio-demo:ci -c 'ls -a /app' | grep -E '^\.env$'

      - name: Docker Compose config is valid
        run: |
          POSTGRES_PASSWORD=x APP_DB_PASSWORD=x JWT_SECRET=x DEMO_ADMIN_PASSWORD=x \
          DEMO_ANALYST_PASSWORD=x DEMO_VIEWER_PASSWORD=x DEMO_REVIEWER_PASSWORD=x \
            docker compose --profile demo config --quiet

      # Fails on CRITICAL vulnerabilities that have a fix available.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ai-portfolio-demo:ci
          version: v0.76.1
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # AWS production path (ADR 0008): validated on every PR, never applied. No AWS
  # credentials exist in this workflow.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -recursive -check -diff

      - name: terraform validate
        working-directory: infra/terraform/envs/production
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # plugin download rate limit
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: checkov
        run: uvx --python 3.12 checkov==3.4.10 -d . --framework terraform --quiet --compact
