name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same image as docker-compose.yml. Throwaway, CI-only credentials.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Tests create a fresh database from this admin connection and run the
      # Alembic migrations into it. REQUIRE_DB_TESTS turns "skip" into "fail".
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-only-not-a-secret@localhost:5432/ci
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest

      # Report only (ADR 0006): prints development vs held-out numbers, never fails the
      # build. The development targets are enforced by the pytest gate above.
      - name: Guardrails held-out report
        run: |
          uv run python scripts/guardrails_report.py --heldout \
            --out "$RUNNER_TEMP/guardrails-results.md" 2>/dev/null \
            | sed -n '/## Held-out and public evaluation/,$p' || true
