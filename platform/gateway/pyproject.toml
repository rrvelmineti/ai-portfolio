[project]
name = "ai-platform-gateway"
version = "0.1.0"
description = "Model gateway: the single entry point products use to call AI models."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-common",
    "anthropic==2.14.0",
    "boto3==1.44.12",
    "google-genai==3.6.1",
    "groq==1.7.0",
    "langchain-core==1.8.5",
    "openai==3.60.0",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
    "tenacity==9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform_gateway"]

[tool.uv.sources]
ai-platform-common = { workspace = true }
