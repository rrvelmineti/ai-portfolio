[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Production-grade AI portfolio monorepo: shared platform + four products."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["ai-platform-common", "ai-platform-gateway"]

[dependency-groups]
dev = [
    "boto3-stubs[bedrock-runtime]==1.44.12",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml==6.0.12.20261122",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core/common", "core/gateway"]

[tool.uv.sources]
ai-platform-common = { workspace = true }
ai-platform-gateway = { workspace = true }

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["infra"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "ANN",     # type annotations required
    "S",       # bandit security checks
    "SIM",     # simplifications
    "T20",     # no print statements (use structured logging)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN401"]  # assert and Any-typed fixtures are fine in tests
"scripts/**" = ["T201"]                # CLI scripts print their output

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["core", "products"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not live",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

markers = [
    "live: calls real provider APIs (needs keys; excluded by default, run with -m live)",
]

[tool.coverage.run]
source = ["core", "products"]
omit = ["**/tests/**"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "core/common/src",
    "core/common/tests",
    "core/gateway/src",
    "core/gateway/tests",
    "scripts",
]
