[project]
name = "ai-portfolio"
version = "0.1.0"
description = "Production-grade AI portfolio monorepo: shared platform + four products."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-auth",
    "ai-platform-common",
    "ai-platform-gateway",
    "ai-platform-guardrails",
    "ai-platform-observability",
]

[dependency-groups]
# Presidio NLP model (~400 MB). Installed by default (CI enforces accuracy targets on it).
nlp-models = ["en-core-web-lg"]
dev = [
    "boto3-stubs[bedrock-runtime]==1.44.12",
    "faker==40.63.0",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml==6.0.12.20261122",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
default-groups = ["dev", "nlp-models"]

[tool.uv.workspace]
members = [
    "core/auth",
    "core/common",
    "core/gateway",
    "core/guardrails",
    "core/observability",
]

[tool.uv.sources]
ai-platform-common = { workspace = true }
ai-platform-gateway = { workspace = true }
ai-platform-auth = { workspace = true }
ai-platform-observability = { workspace = true }
ai-platform-guardrails = { workspace = true }
# spaCy model for Presidio: not on PyPI, pinned by URL (hash recorded in uv.lock)
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["infra"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "ANN",     # type annotations required
    "S",       # bandit security checks
    "SIM",     # simplifications
    "T20",     # no print statements (use structured logging)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN401", "S105", "S106"]  # asserts, Any fixtures, synthetic passwords
"scripts/**" = ["T201"]                # CLI scripts print their output
"**/injection/rules.py" = ["E501"]     # regex tables read better unwrapped

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["core", "products"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not live",
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

markers = [
    "live: calls real provider APIs (needs keys; excluded by default, run with -m live)",
]

[tool.coverage.run]
source = ["core", "products"]
omit = ["**/tests/**"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
# Test modules are named by path (core.auth.tests.conftest), packages from src/.
explicit_package_bases = true
namespace_packages = true
mypy_path = [
    "core/auth/src",
    "core/common/src",
    "core/gateway/src",
    "core/guardrails/src",
    "core/observability/src",
]
files = [
    "core/auth/demo_app.py",
    "core/auth/src",
    "core/auth/tests",
    "core/common/src",
    "core/common/tests",
    "core/gateway/src",
    "core/gateway/tests",
    "core/guardrails/src",
    "core/guardrails/tests",
    "core/observability/src",
    "core/observability/tests",
    "scripts",
]
