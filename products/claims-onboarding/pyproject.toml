[project]
name = "claims-onboarding"
version = "0.1.0"
description = "Claims onboarding: a client's claims extract from first file to go-live (Spec 1)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-auth",
    "ai-platform-common",
    "ai-platform-guardrails",
    "ai-platform-observability",
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_onboarding"]

[tool.uv.sources]
ai-platform-auth = { workspace = true }
ai-platform-common = { workspace = true }
ai-platform-guardrails = { workspace = true }
ai-platform-observability = { workspace = true }
