[project]
name = "ai-platform-auth"
version = "0.1.0"
description = "Authentication, roles, tenants and audit log for ai-portfolio products."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-common",
    "email-validator==2.4.0",
    "fastapi==0.165.0",
    "pwdlib[argon2]==0.4.2",
    "pyjwt==2.15.1",
    "python-multipart==0.0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform_auth"]

[tool.uv.sources]
ai-platform-common = { workspace = true }
