# Model routing for the gateway. Config, not code.
#
#   models:  catalog of concrete models. Prices are USD per 1M tokens.
#   aliases: what products ask for. `fallback` is tried in order; entries whose
#            provider has no credentials in the environment are skipped.
#
# Price rule: never guess. A price is filled in only when it was read from the
# provider's official pricing page (date + URL below). Otherwise it is null with a
# "# verify:" comment; cost_usd for that entry is then null and the gateway logs
# cost_unknown=true. `test_unverified_prices` prints every such entry.
#
# Prices checked on 2026-11-26 against:
#   Anthropic  https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI     https://developers.openai.com/api/docs/pricing
#   Gemini     https://aistudio.google.com/docs/pricing
#   Groq       https://console.groq.com/docs/models   (Llama prices not published)
#   Bedrock    https://aws.amazon.com/bedrock/pricing/ (Claude/Titan table not readable)
#
# supports_temperature: false means the adapter drops `temperature` for that model
# (current Claude models reject non-default sampling parameters).

models:
  # ---------------------------------------------------------------- Anthropic
  anthropic/claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    price_input_per_1m: 2.00
    price_output_per_1m: 10.00
    context_limit: 1000000
    supports_temperature: false
    supports_images: true

  anthropic/claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    price_input_per_1m: 4.00
    price_output_per_1m: 20.00
    context_limit: 1000000
    supports_temperature: false
    supports_images: true

  anthropic/claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    price_input_per_1m: 0.10
    price_output_per_1m: 0.50
    long_prompt_threshold_tokens: 100000  # prompts over 100K tokens bill at the higher tier
    long_prompt_price_input_per_1m: 0.50
    long_prompt_price_output_per_1m: 2.50
    context_limit: null  # verify: pricing page and Bedrock card disagree (200K vs 1M)
    supports_temperature: false
    supports_images: true

  # ---------------------------------------------------------------- AWS Bedrock
  # Global cross-region inference profiles (model cards, docs.aws.amazon.com).
  bedrock/claude-sonnet-5-5:
    provider: bedrock
    model: global.anthropic.claude-sonnet-5-5
    price_input_per_1m: null   # verify: Bedrock on-demand price for Claude Sonnet 5.5
    price_output_per_1m: null  # verify: Bedrock on-demand price for Claude Sonnet 5.5
    context_limit: 1000000
    supports_temperature: false
    supports_images: true

  bedrock/claude-opus-5-5:
    provider: bedrock
    model: global.anthropic.claude-opus-5-5
    price_input_per_1m: null   # verify: Bedrock on-demand price for Claude Opus 5.5
    price_output_per_1m: null  # verify: Bedrock on-demand price for Claude Opus 5.5
    context_limit: 1000000
    supports_temperature: false
    supports_images: true

  bedrock/titan-embed-text-v2:
    provider: bedrock
    kind: embed
    model: amazon.titan-embed-text-v2:0
    price_input_per_1m: null  # verify: Bedrock price for Titan Text Embeddings V2
    context_limit: 8192
    supported_dimensions: [256, 512, 1024]

  # ---------------------------------------------------------------- OpenAI
  openai/gpt-4o:
    provider: openai
    model: gpt-4o
    price_input_per_1m: 2.50
    price_output_per_1m: 10.00
    context_limit: null  # verify: context window not confirmed from model page
    supports_images: true

  openai/gpt-6-luna:
    # OpenAI's named replacement for the deprecated gpt-4o-mini
    # (developers.openai.com/api/docs/deprecations, checked 2026-11-26); recommended
    # "for cost-sensitive, high-volume workloads" on the models overview.
    provider: openai
    model: gpt-6-luna
    price_input_per_1m: 0.10
    price_output_per_1m: 0.50
    context_limit: 1050000
    # verify: temperature support is not documented; the model has reasoning-effort
    # controls, so temperature is dropped (dropping it cannot cause a 400).
    supports_temperature: false
    supports_images: true

  openai/text-embedding-3-small:
    provider: openai
    kind: embed
    model: text-embedding-3-small
    price_input_per_1m: 0.02
    context_limit: null  # verify: input limit not confirmed from model page

  # ---------------------------------------------------------------- Azure OpenAI
  # Model ids are deployment names from the environment; prices depend on what is deployed.
  azure_openai/chat:
    provider: azure_openai
    model: ${AZURE_OPENAI_DEPLOYMENT}
    price_input_per_1m: null   # verify: depends on the model behind AZURE_OPENAI_DEPLOYMENT
    price_output_per_1m: null  # verify: depends on the model behind AZURE_OPENAI_DEPLOYMENT
    supports_images: true

  azure_openai/embed:
    provider: azure_openai
    kind: embed
    model: ${AZURE_OPENAI_EMBED_DEPLOYMENT}
    price_input_per_1m: null  # verify: depends on the model behind AZURE_OPENAI_EMBED_DEPLOYMENT

  # ---------------------------------------------------------------- Google Gemini
  gemini/gemini-3.8-flash:
    provider: gemini
    model: gemini-3.8-flash
    # Price through 2026-12-31. From 2027-01-01 the page lists $1.50 / $7.50: update then.
    price_input_per_1m: 0.75
    price_output_per_1m: 3.75
    context_limit: null  # verify: context window not confirmed from model page
    supports_images: true

  gemini/gemini-embedding-2:
    provider: gemini
    kind: embed
    model: gemini-embedding-2
    price_input_per_1m: 0.20
    context_limit: 8192

  # ---------------------------------------------------------------- Groq
  groq/llama-3.3-70b-versatile:
    provider: groq
    model: llama-3.3-70b-versatile
    price_input_per_1m: null   # verify: Groq lists "Contact sales"
    price_output_per_1m: null  # verify: Groq lists "Contact sales"
    context_limit: 131072

  groq/llama-3.1-8b-instant:
    provider: groq
    model: llama-3.1-8b-instant
    price_input_per_1m: null   # verify: Groq lists "Contact sales"
    price_output_per_1m: null  # verify: Groq lists "Contact sales"
    context_limit: 131072

aliases:
  default:
    kind: chat
    description: General-purpose default.
    fallback: [anthropic/claude-sonnet-5-5, bedrock/claude-sonnet-5-5, openai/gpt-4o]
  best:
    kind: chat
    description: Highest quality; use for hard reasoning.
    fallback: [anthropic/claude-opus-5-5, bedrock/claude-opus-5-5]
  fast:
    kind: chat
    description: Low latency / low cost.
    fallback: [groq/llama-3.1-8b-instant, anthropic/claude-haiku-5-5, openai/gpt-6-luna]
  vision:
    kind: chat
    description: Image + text input.
    fallback: [anthropic/claude-sonnet-5-5, openai/gpt-4o, gemini/gemini-3.8-flash]
  claude-sonnet:
    kind: chat
    fallback: [anthropic/claude-sonnet-5-5, bedrock/claude-sonnet-5-5]
  openai-mini:
    kind: chat
    description: OpenAI's recommended small model (was the gpt-4o-mini alias).
    fallback: [openai/gpt-6-luna, azure_openai/chat]
  gemini-flash:
    kind: chat
    fallback: [gemini/gemini-3.8-flash]
  groq-llama:
    kind: chat
    fallback: [groq/llama-3.3-70b-versatile]

  default-embed:
    kind: embed
    description: >-
      1536-dim text embeddings. Every entry returns the same size so vectors stay
      comparable across fallbacks. Titan cannot produce 1536, so it has its own alias.
    dimensions: 1536
    fallback: [openai/text-embedding-3-small, azure_openai/embed, gemini/gemini-embedding-2]
  titan-embed:
    kind: embed
    dimensions: 1024
    fallback: [bedrock/titan-embed-text-v2]
