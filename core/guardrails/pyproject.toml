[project]
name = "ai-platform-guardrails"
version = "0.1.0"
description = "PII masking (Presidio), prompt-injection defence, topic policy and human approval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-auth",
    "ai-platform-common",
    "ai-platform-gateway",
    "ai-platform-observability",
    "fastapi==0.165.0",
    "onnxruntime==1.32.0",
    "presidio-analyzer==2.2.366",
    "presidio-anonymizer==2.2.366",
    "pyyaml==6.0.4",
    "spacy==3.8.18",
    "tokenizers==0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform_guardrails"]

[tool.uv.sources]
ai-platform-common = { workspace = true }
ai-platform-gateway = { workspace = true }
ai-platform-auth = { workspace = true }
ai-platform-observability = { workspace = true }
