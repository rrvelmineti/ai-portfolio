[project]
name = "ai-platform-observability"
version = "0.1.0"
description = "Request context wiring, access logs, AI call tracing, metrics and health for ai-portfolio."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-platform-common",
    "ai-platform-gateway",
    "fastapi==0.165.0",
    "langsmith==0.16.2",
    "prometheus-client==0.26.0",
    "sentry-sdk==3.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform_observability"]

[tool.uv.sources]
ai-platform-common = { workspace = true }
ai-platform-gateway = { workspace = true }
