[project]
name = "ai-platform-common"
version = "0.1.0"
description = "Shared utilities for the ai-portfolio platform and products."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "sqlalchemy==2.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_platform_common"]
